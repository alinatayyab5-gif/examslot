<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Password - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
const D=db(),t=D.tokens.find(x=>x.t==Q.get('token')),s=t&&D.students.find(x=>x.email==t.email),A=$('#app');
if(!t||t.used||t.exp<Date.now()||!s)A.innerHTML=`${themeBtn('auth-theme')}<div class="auth"><div class="card ctr"><div class="ban er">This link has expired or was already used.</div><p>Links are valid once and for a limited time.</p><a class="btn p" href="forgot-password.html">Request a new link</a></div></div>`;
else{const m=s.email.replace(/^(.).*@/,'$1***@');
A.innerHTML=`${themeBtn('auth-theme')}<div class="auth"><div class="card"><h1>Set your password</h1><p class="mu">Welcome, ${esc(s.name)} (${m})</p><form novalidate><label>New password</label><input id="p1" type="password"><div id="ck" class="mu"></div><label>Confirm password</label><input id="p2" type="password"><span class="err" id="e2"></span><p><button class="btn p" style="width:100%">Set password</button></p></form><p class="mu">You will be asked to sign in after saving.</p></div></div>`;
const rules=v=>[[v.length>=8,'At least 8 characters'],[/[a-z]/.test(v)&&/[A-Z]/.test(v),'Upper and lower case'],[/\d/.test(v),'At least one number']];
const chk=()=>$('#ck').innerHTML='Strength: <b>'+['Weak','Weak','Fair','Good'][rules($('#p1').value).filter(r=>r[0]).length]+'</b><br>'+rules($('#p1').value).map(r=>(r[0]?'&#9745; ':'&#9744; ')+r[1]).join('<br>');chk();$('#p1').oninput=chk;
$('form').onsubmit=e=>{e.preventDefault();if(rules($('#p1').value).some(r=>!r[0]))return toast('Password is too weak','er');if($('#p1').value!=$('#p2').value)return $('#e2').textContent='Passwords do not match';
 s.password=$('#p1').value;s.status='active';t.used=true;save(D);toast('Password set, please sign in');setTimeout(()=>location.href='login.html',1200)}}
</script></body></html>
