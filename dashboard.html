<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('admin','dashboard',(m,D)=>{const S=D.students,p=D.requests.filter(r=>r.status=='pending'),cnt=(a,f)=>a.filter(f).length;
 const st=['Saved','In progress','Not started','Incomplete'].map(k=>[k,cnt(S,s=>sheetSt(s)==k)]),rq=['pending','approved','rejected'].map(k=>[k,cnt(D.requests,r=>r.status==k)]);
 const bars=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.map(([k,v])=>`<div class="row2" style="display:flex;justify-content:space-between"><span>${k}</span><b>${v}</b></div><span class="bc" style="width:${v/mx*100}%"></span>`).join('')||'No data yet'};
 m.innerHTML=`<div class="hd"><h1>Dashboard</h1><span><a class="btn p" href="student-form.html">+ Student</a> <a class="btn p" href="slot-form.html">+ Slot</a> <button class="btn" onclick="location.reload()">Refresh</button></span></div>
 <div class="grid"><a class="card" href="students.html"><span class="stat">${S.length}<small>Total students</small></span></a><a class="card" href="students.html"><span class="stat">${cnt(S,s=>s.sheetSaved)}<small>Date sheets saved</small></span></a><a class="card" href="requests.html"><span class="stat">${p.length}<small>Pending requests</small></span></a><a class="card" href="branches.html"><span class="stat">${cnt(D.branches,b=>b.active)}<small>Active branches</small></span></a></div>
 <div class="grid"><div class="card"><h3>Date sheet status</h3>${bars(st)}</div><div class="card"><h3>Requests by status</h3>${bars(rq)}</div></div>
 <div class="card"><h3>Latest pending requests</h3>${p.length?`<div class="tw"><table class="rt"><thead><tr><th>Student<th>Reg No<th>Type<th>Raised<th></tr></thead>${p.slice(0,5).map(r=>{const s=S.find(x=>x.id==r.sid);return`<tr><td data-l="Student">${esc(s.name)}<td data-l="Reg">${s.reg}<td data-l="Type">${r.type=='branch'?'Change branch':'Change date sheet'}<td data-l="Raised">${fd(r.raised)}<td><a href="requests.html">Review</a></tr>`}).join('')}</table></div>`:'<p class="empty">No pending requests</p>'}</div>`});
</script></body></html>
