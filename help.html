<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Need Help - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('student','help',(m,D,u)=>{const pend=t=>D.requests.some(r=>r.sid==u.id&&r.type==t&&r.status=='pending'),open=t=>D.requests.some(r=>r.sid==u.id&&r.type==t&&r.status=='approved'&&!r.used);
 const el={branch:!!u.branchId&&!u.branchUnlock&&!pend('branch')&&!open('branch'),sheet:u.sheetSaved&&!u.sheetUnlock&&!pend('sheet')&&!open('sheet')};let t=el.branch?'branch':el.sheet?'sheet':'';
 const opt=(k,l,d)=>`<div class="pick ${t==k?'sel':''}" ${el[k]?`data-k="${k}"`:'style="opacity:.5;cursor:default"'}><b>${l}</b><br><span class="mu">${d}</span><br>${el[k]?bdg('Available','ok'):bdg(pend(k)?'Pending request exists':open(k)?'Approved: use your unlock first':k=='branch'?'Select a branch first':'Save a date sheet first','w')}</div>`;
 const draw=()=>{m.innerHTML=`<h1>Need help?</h1><p class="mu">Choose what you want to change and tell us why.</p><div class="grid">${opt('branch','Request to change branch','Reopens branch selection once if approved.')}${opt('sheet','Request to change date sheet','Reopens the date sheet page once if approved.')}</div>
 <div class="card" style="margin-top:14px"><label>Reason * (10 to 300 characters)</label><textarea id="rs" maxlength="300" placeholder="Explain why you need this change..."></textarea><span class="mu" id="ct">0 / 300</span> <span class="err" id="e"></span><div class="mb"><a class="btn" href="requests.html">View my requests</a><button class="btn p" id="sb" ${t?'':'disabled'}>Submit request</button></div></div>`;
 $('#rs').oninput=e=>$('#ct').textContent=e.target.value.length+' / 300';m.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{const v=$('#rs')?.value;t=x.dataset.k;draw();$('#rs').value=v||''});
 $('#sb').onclick=()=>{const r=$('#rs').value.trim();if(r.length<10)return $('#e').textContent='Reason must be 10 to 300 characters';if(/[<>]/.test(r))return $('#e').textContent='Characters < and > are not allowed';D.requests.push({id:nid(D.requests),sid:u.id,type:t,reason:r,raised:new Date().toISOString().slice(0,10),status:'pending',remark:'',used:false});save(D);toast('Request submitted');setTimeout(()=>location.href='requests.html',700)}};draw()});
</script></body></html>
