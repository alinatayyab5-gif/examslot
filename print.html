<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Date Sheet - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('student','date-sheet',(m,D,u)=>{if(!u.sheetSaved)return go('student/dashboard.html');const b=D.branches.find(x=>x.id==u.branchId),rows=Object.values(u.picks).map(i=>D.slots.find(x=>x.id==i)).sort((a,c)=>(a.date+a.start).localeCompare(c.date+c.start));
 m.innerHTML=`<p class="noprint"><button class="btn p" onclick="print()">Print</button> <a class="btn" href="date-sheet.html">Back</a></p><div class="card sheet" style="color:#000"><h3>VIRTUAL UNIVERSITY</h3><h2>Final Examination Date Sheet - Fall 2026</h2><p>Name: <b>${esc(u.name)}</b> &nbsp; Reg No: <b>${u.reg}</b><br>Program: <b>${u.program}</b> &nbsp; Branch: <b>${b.name}</b></p>
 <table style="border:1px solid #000"><tr><th>Code<th>Course<th>Date<th>Day<th>Time</tr>${rows.map(s=>{const c=D.courses.find(x=>x.id==s.courseId);return`<tr><td>${c.code}<td>${c.title}<td>${fd(s.date)}<td>${day(s.date).slice(0,3)}<td>${rng(s)}</tr>`}).join('')}</table>
 <p>Notes: Arrive 30 minutes early. Bring student ID card.</p><p style="margin-top:50px;display:flex;justify-content:space-between"><span>_____________<br>Student signature</span><span>_____________<br>Controller of Exams</span></p><p class="mu">Generated ${new Date().toLocaleString('en-GB')} | Page 1 of 1</p></div>`});
</script></body></html>
