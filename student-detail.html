<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Detail - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('admin','students',(m,D)=>{const s=D.students.find(x=>x.id==+Q.get('id'));if(!s)return location.href='../auth/error.html?code=404';
 const b=D.branches.find(x=>x.id==s.branchId),kv=a=>a.map(([k,v])=>`<p class="mu">${k}<br><b style="color:var(--t)">${esc(v)}</b></p>`).join(''),rq=D.requests.filter(r=>r.sid==s.id);
 m.innerHTML=`<div class="hd"><div><h1>${esc(s.name)}</h1><p class="mu">${s.reg} | ${s.program} | Semester ${s.sem}</p>${acct(s)} ${bdg('Branch: '+(b?b.name:'none'))} ${bdg('Sheet: '+sheetSt(s))}</div><div><a class="btn" href="student-form.html?id=${s.id}">Edit</a> <button class="btn" id="rs">${s.status=='active'?'Send password reset':'Resend invite'}</button> <button class="btn d" id="dl">Delete</button></div></div>
 <div class="grid"><div class="card"><h3>Personal</h3>${kv([['Email',s.email],['Phone',s.phone],['CNIC',s.cnic],['DOB',fd(s.dob)]])}</div><div class="card"><h3>Parent / guardian</h3>${kv([['Father',s.father],['Parent CNIC',s.pcnic],['Contact',s.pphone],['Emergency',s.emerg]])}</div><div class="card"><h3>Academic</h3>${kv([['Reg no',s.reg],['Program',s.program],['CGPA',s.cgpa],['Batch',s.batch]])}</div></div>
 <div class="grid"><div class="card"><h3>Branch and unlock status</h3><p>Branch: ${b?esc(b.name)+' (locked)':'Not chosen'}</p><p>Branch unlock: ${s.branchUnlock?'Yes':'No'}</p><p>Date sheet unlock: ${s.sheetUnlock?'Yes':'No'}</p><p class="mu">Read only. Changed by approving requests.</p></div>
 <div class="card"><h3>Assigned courses (${s.courses.length} of 6) <a class="btn s" href="assignment-manage.html?id=${s.id}">Manage</a></h3>${s.courses.map(c=>{const x=D.courses.find(y=>y.id==c);return`<p>${x.code} ${x.title}</p>`}).join('')||'None'}</div></div>
 <div class="card"><h3>Date sheet (read only)</h3>${s.sheetSaved?`<div class="tw"><table><tr><th>Course<th>Date<th>Time</tr>${Object.values(s.picks).map(i=>D.slots.find(x=>x.id==i)).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${D.courses.find(c=>c.id==x.courseId).code}<td>${fd(x.date)}<td>${rng(x)}</tr>`).join('')}</table></div>`:'Not saved yet'}</div>
 <div class="card"><h3>Requests</h3>${rq.length?rq.map(r=>`<p>${r.type=='branch'?'Change branch':'Change date sheet'} - ${r.status}</p>`).join(''):'No requests'}</div>`;
 $('#dl').onclick=()=>delFlow(s.name,s.sheetSaved?'This student has saved a date sheet.':'',()=>{s.status='inactive';done(D,0,'Student marked inactive');setTimeout(()=>location.reload(),600)},()=>{D.students=D.students.filter(x=>x!==s);done(D,0,'Student deleted');setTimeout(()=>location.href='students.html',600)});
 $('#rs').onclick=()=>{const t=token(D,s.email,s.status=='active'?1:24);save(D);modal(`<h3>Link created</h3><p>Email would be sent now. Demo link:</p><a href="../auth/reset-password.html?token=${t}">Open password setup link</a>`,[['OK','p']])}});
</script></body></html>
