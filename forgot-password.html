<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
$('#app').innerHTML=`${themeBtn('auth-theme')}<div class="auth"><div class="card"><h1>Forgot your password?</h1><p class="mu">Enter your registered email. We will send a link to set a new password.</p>
<form novalidate><label>Email</label><input id="em" type="email"><p><button class="btn p" id="bt" style="width:100%">Send reset link</button></p></form><div id="ok"></div><p><a href="login.html">&lt; Back to sign in</a></p></div></div>`;
$('form').onsubmit=e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email','er');const R=JSON.parse(localStorage.getItem('es_fg')||'{}'),rc=(R[em]||[]).filter(t=>Date.now()-t<36e5);if(rc.length>=3)return toast('Please wait before requesting again','er');rc.push(Date.now());R[em]=rc;localStorage.setItem('es_fg',JSON.stringify(R));
 const D=db(),s=D.students.find(x=>x.email==em);let demo='';
 if(s){demo=`<p class="mu">Demo only (no email server yet): <a href="reset-password.html?token=${token(D,em,1)}">open the reset link</a></p>`;save(D)}
 $('#ok').innerHTML=`<div class="ban ok">If this email is registered, a reset link has been sent. Check inbox and spam.</div>${demo}`;
 let n=60;const b=$('#bt');b.disabled=true;const t=setInterval(()=>{b.textContent=`Resend available in ${--n} s`;if(n<=0){clearInterval(t);b.disabled=false;b.textContent='Send reset link'}},1000)};
</script></body></html>
