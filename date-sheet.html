<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Sheet - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('student','date-sheet',(m,D,u)=>{if(!u.sheetSaved)return go('student/dashboard.html');const b=D.branches.find(x=>x.id==u.branchId),rows=Object.values(u.picks).map(i=>D.slots.find(x=>x.id==i)).sort((a,c)=>(a.date+a.start).localeCompare(c.date+c.start));
 const ok=D.requests.some(r=>r.sid==u.id&&r.type=='sheet'&&r.status=='approved'&&!r.used);
 m.innerHTML=`<div class="ban w noprint">Locked. Saved on ${fd(u.savedAt)}, ${u.savedAt.slice(11,16)}</div>${ok?'<div class="ban ok noprint">Date sheet change approved. <a href="dashboard.html">Edit now (one time)</a></div>':''}
 <div class="card sheet"><h3>VIRTUAL UNIVERSITY</h3><h2>Final Examination Date Sheet - Fall 2026</h2><p>Student name: <b>${esc(u.name)}</b> &nbsp; Registration no: <b>${u.reg}</b><br>Program: <b>${u.program}</b> &nbsp; Exam branch: <b>${b.name}</b></p>
 <div class="tw"><table class="rt"><thead><tr><th>Code<th>Course title<th>Date<th>Day<th>Time</tr></thead>${rows.map(s=>{const c=D.courses.find(x=>x.id==s.courseId);return`<tr><td data-l="Code">${c.code}<td data-l="Course">${c.title}<td data-l="Date">${fd(s.date)}<td data-l="Day">${day(s.date)}<td data-l="Time">${rng(s)}</tr>`}).join('')}</table></div><p class="mu">Sorted by date, earliest first. Carry your student ID card to the exam.</p></div>
 <p class="noprint"><a class="btn p" href="print.html">Print Date Sheet</a> <a class="btn" href="print.html">Download PDF (choose Save as PDF)</a> <a class="btn" href="help.html">Need help? Request a change</a></p>`});
</script></body></html>
