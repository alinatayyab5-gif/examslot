<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
const u0=me();if(u0)go(home(u0));
$('#app').innerHTML=`<div class="lg"><section class="lg-side"><a class="brand" href="login.html"><span class="logo">${IC.cal}</span>ExamSlot</a>
<h1>Your exams. Your schedule.</h1><p>Pick your branch, choose a time for every paper, and print your own date sheet in minutes.</p>
<div class="lg-pts"><div>${IC.pin}Sit your papers at the campus that suits you</div><div>${IC.clock}Clash-free dates, checked for you</div><div>${IC.shield}One-time locks keep every sheet fair</div></div></section>
<main class="lg-main">${themeBtn('lg-theme')}<div class="lg-card"><h2>Welcome back</h2><p class="mu" style="margin-bottom:18px">Sign in to your ExamSlot portal.</p><div id="er"></div>
<form novalidate><label>Email</label><input id="em" type="email" autocomplete="username" autofocus><label>Password</label><div class="ig"><input id="pw" type="password" autocomplete="current-password"><button type="button" class="btn" id="tg" aria-label="Show or hide password">Show</button></div>
<div class="lg-fp"><a href="forgot-password.html">Forgot password?</a></div><button class="btn p" style="width:100%">Sign in</button></form>
<p class="lg-note" style="margin-top:22px">Accounts are created by the university administration. There is no self sign-up.</p>
<p class="lg-note">Demo admin: admin@examslot.edu.pk / Admin123<br>Demo student: ali@student.edu.pk / Student123</p></div></main></div>`;
$('#tg').onclick=function(){const i=$('#pw'),sh=i.type=='password';i.type=sh?'text':'password';this.textContent=sh?'Hide':'Show'};
$('form').onsubmit=e=>{e.preventDefault();const D=db(),em=$('#em').value.trim().toLowerCase(),p=$('#pw').value,er=m=>$('#er').innerHTML=`<div class="ban er">${m}</div>`;
 if(!em||!p)return er('Email and password are required');const F=JSON.parse(localStorage.getItem('es_fails')||'{}'),rc=(F[em]||[]).filter(t=>Date.now()-t<9e5);if(rc.length>=5)return er('Too many attempts, try again in 15 minutes');
 const a=D.admin.email==em&&D.admin.password==p?{role:'admin',id:0}:null,s=D.students.find(x=>x.email==em);
 if(s&&!s.password)return er('Use the link in your email or Forgot password');
 const ok=a||(s&&s.password==p&&s.status=='active'&&{role:'student',id:s.id});
 if(!ok){rc.push(Date.now());F[em]=rc;localStorage.setItem('es_fails',JSON.stringify(F));return er('Invalid email or password')}
 localStorage.setItem('es_user',JSON.stringify(ok));const nx=sessionStorage.getItem('es_next');sessionStorage.removeItem('es_next');if(nx&&nx.includes('/'+ok.role+'/'))return location.href=nx;go(home(ok))};
</script></body></html>
