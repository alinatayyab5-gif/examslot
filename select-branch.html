<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Branch - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('student','gate',(m,D,u)=>{if(u.branchId&&!u.branchUnlock)return go(home({role:'student',id:u.id}));
 let sel=u.branchId,q='';const br=D.branches.filter(b=>b.active);
 const draw=()=>{m.innerHTML=`<h1>Select your exam branch</h1><div class="ban w">You can choose only once. Changes later need admin approval.</div>${u.branchUnlock?'<div class="ban ok">Admin approved your request. You can change branch once.</div>':''}
 <input id="bq" placeholder="Search branch or city" value="${esc(q)}" style="margin-bottom:12px"><div class="grid">${br.filter(b=>(b.name+b.city).toLowerCase().includes(q.toLowerCase())).map(b=>`<div class="pick ${b.id==sel?'sel':''}" data-b="${b.id}"><b>${b.name}</b><br>Code: ${b.code}<br>${b.city}<br><span class="mu">${b.address}</span></div>`).join('')||'<p class="empty">No branches</p>'}</div>
 <p><button class="btn p" id="cf" ${sel?'':'disabled'}>Confirm branch</button></p>`;
 $('#bq').oninput=e=>{q=e.target.value;draw();$('#bq').focus()};m.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{sel=+x.dataset.b;draw()});
 $('#cf').onclick=()=>{const b=br.find(x=>x.id==sel);modal(`<h3>Confirm ${b.name}?</h3><p>You cannot change this later without admin approval.</p>`,[['Go back',''],['Yes, confirm','p',()=>{const full=u.sheetSaved&&Object.values(u.picks).some(i=>{const x=D.slots.find(y=>y.id==i);return taken(D,x,b.id)>=x.seats});if(full){toast('This branch is full for one of your saved slots. Request a date sheet change instead.','er');return}u.branchId=b.id;u.branchUnlock=false;D.requests.filter(r=>r.sid==u.id&&r.type=='branch'&&r.status=='approved'&&!r.used).forEach(r=>r.used=true);save(D);toast('Branch saved');setTimeout(()=>go(home({role:'student',id:u.id})),600)}]])}};draw()});
</script></body></html>
