<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Assignments - ExamSlot</title><script src="../../js/theme.js"></script><link rel="stylesheet" href="../../css/style.css"></head><body><div id="app"></div><script src="../../js/data.js"></script><script src="../../js/app.js"></script><script>
page('admin','assignments',(m,D)=>{const s=D.students.find(x=>x.id==+Q.get('id'));if(!s)return location.href='../auth/error.html?code=404';let q='',pp=1;
 const draw=()=>{const locked=s.sheetSaved&&!s.sheetUnlock,msg=t=>toast(t,'er'),b=D.branches.find(x=>x.id==s.branchId);
  const fl=D.courses.filter(c=>(c.code+c.title).toLowerCase().includes(q.toLowerCase())),tp=Math.max(1,Math.ceil(fl.length/4));pp=Math.min(pp,tp);
  m.innerHTML=`<div class="hd"><div><h1>Manage Courses</h1><p class="mu">${esc(s.name)} (${s.reg}) | ${s.program} | Branch: ${b?b.name:'-'}</p></div><a class="btn" href="assignments.html">Back</a></div>
  ${locked?'<div class="ban w">Date sheet saved: editing is locked until an approved change request.</div>':''}<div class="card"><h3>Assigned courses ${bdg(s.courses.length+' of 6 (min 4)',s.courses.length<4?'er':'ok')}</h3>
  ${s.courses.map(id=>{const c=D.courses.find(x=>x.id==id);return`<p>${c.code} ${c.title} <button class="btn s" data-r="${id}">Remove</button></p>`}).join('')||'<p class="mu">None yet</p>'}<p class="mu">Cannot go below 4 once complete. To swap: add first, then remove.</p></div>
  <div class="card"><h3>Add a course</h3><input id="cq" placeholder="Code or title" value="${esc(q)}"><div class="tw"><table>${fl.slice((pp-1)*4,pp*4).map(c=>`<tr><td>${c.code}<td>${c.title}<td>${s.courses.includes(c.id)?bdg('Assigned'):!c.active?bdg('Inactive'):`<button class="btn s" data-a="${c.id}">Assign</button>`}</tr>`).join('')}</table></div><p class="mu">${fl.length?(pp-1)*4+1:0}-${Math.min(pp*4,fl.length)} of ${fl.length} <button class="btn s" id="pv" ${pp<2?'disabled':''}>Prev</button> <button class="btn s" id="nx" ${pp>=tp?'disabled':''}>Next</button></p></div>`;
  $('#cq').oninput=e=>{q=e.target.value;pp=1;draw();$('#cq').focus()};$('#pv').onclick=()=>{pp--;draw()};$('#nx').onclick=()=>{pp++;draw()};
  m.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{if(locked)return msg('Locked: date sheet saved');if(s.courses.length>=6)return msg('A student can have at most 6 courses.');s.courses.push(+x.dataset.a);done(D,draw,'Course assigned')});
  m.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{const id=+x.dataset.r;if(locked)return msg('Locked: date sheet saved');if(s.courses.length>=4&&s.courses.length-1<4)return msg('Cannot go below 4 courses. Add another course first.');
   s.courses=s.courses.filter(c=>c!=id);delete s.picks[id];if(s.draft)delete s.draft[id];if(s.sheetUnlock){s.sheetSaved=false}done(D,draw,'Course removed')})};draw()});
</script></body></html>
